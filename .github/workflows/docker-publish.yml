name: Build and publish container

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOCKERHUB_IMAGE: wisdomsky/palsentry
  GHCR_IMAGE: ghcr.io/wisdomsky/palsentry

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Validate environment-only Compose configuration
        env:
          PALWORLD_REST_URL: http://palworld.internal:8212
          PALWORLD_ADMIN_PASSWORD: compose-check-palworld-password
        run: |
          test ! -e .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

          # The optional template must remain inert until its required Palworld password is filled.
          docker compose --env-file .env.example config --quiet
          if env -u PALWORLD_REST_URL -u PALWORLD_ADMIN_PASSWORD \
            docker compose --env-file .env.example config --quiet 2>/dev/null; then
            echo "An unconfigured .env.example must not produce a runnable configuration." >&2
            exit 1
          fi

          docker compose config --format json > /tmp/palsentry-compose.json
          node --input-type=commonjs <<'NODE'
          const model = require('/tmp/palsentry-compose.json');
          const service = model.services.palsentry;
          const environment = service.environment;

          if (service.image !== 'ghcr.io/wisdomsky/palsentry:latest') {
            throw new Error(`Unexpected default image: ${service.image}`);
          }
          if (service.build !== undefined) {
            throw new Error('The default production service must pull rather than build.');
          }
          if (environment.PALWORLD_REST_URL !== process.env.PALWORLD_REST_URL) {
            throw new Error('Shell-provided environment was not passed to the service.');
          }
          if (
            environment.PALSENTRY_LOGIN_PASSWORD !== 'admin' ||
            environment.PALSENTRY_SESSION_SECRET !==
              'bb5930c05402c03f897c0cdd0e98bb8420a8359f7dbab25fe53df1a5c060d5ea' ||
            environment.PALSENTRY_ALLOW_DESTRUCTIVE !== 'true'
          ) {
            throw new Error('Compose did not apply the documented PalSentry defaults.');
          }
          if (
            environment.PALSENTRY_HOST !== '0.0.0.0' ||
            environment.PALSENTRY_PORT !== '3000' ||
            environment.PALSENTRY_DATA_DIR !== '/data'
          ) {
            throw new Error('Container host, port, and data directory must remain pinned.');
          }
          if ('PALSENTRY_DB_PATH' in environment || 'PALSENTRY_WEB_DIST' in environment) {
            throw new Error('Local-only path overrides must not be exposed in production Compose.');
          }
          NODE

  image-check:
    name: Build pull-request image
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish multi-platform image
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=PalSentry
            org.opencontainers.image.description=Self-hosted dashboard for a Palworld dedicated server
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=PalSentry
            org.opencontainers.image.description=Self-hosted dashboard for a Palworld dedicated server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Separate immutable and named tags
        id: publication_tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sha_tags=()
          named_tags=()

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            case "${tag##*:}" in
              sha-*) sha_tags+=("$tag") ;;
              *) named_tags+=("$tag") ;;
            esac
          done <<< "$GENERATED_TAGS"

          if ((${#sha_tags[@]} == 0)); then
            echo 'docker/metadata-action did not generate a sha-* tag.' >&2
            exit 1
          fi

          {
            echo 'sha_tags<<TAGS'
            printf '%s\n' "${sha_tags[@]}"
            echo 'TAGS'
            echo 'named_tags<<TAGS'
            if ((${#named_tags[@]} > 0)); then
              printf '%s\n' "${named_tags[@]}"
            fi
            echo 'TAGS'
            if ((${#named_tags[@]} > 0)); then
              echo 'has_named=true'
            else
              echo 'has_named=false'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish SHA tags first
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.publication_tags.outputs.sha_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish latest and semantic-version tags after SHA tags
        if: steps.publication_tags.outputs.has_named == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAMED_TAGS: ${{ steps.publication_tags.outputs.named_tags }}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            image="${tag%:*}"
            echo "Publishing $tag from ${image}@${DIGEST}"
            docker buildx imagetools create --tag "$tag" "${image}@${DIGEST}"
          done <<< "$NAMED_TAGS"

      - name: Summarize published image
        run: |
          {
            echo '### Published container image'
            echo '- Docker Hub: `${{ env.DOCKERHUB_IMAGE }}`'
            echo '- GHCR: `${{ env.GHCR_IMAGE }}`'
            echo '- Shared digest: `${{ steps.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
