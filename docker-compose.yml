# PalSentry — Palworld server management dashboard
#
#   Option A: export the required Palworld variables in your shell or Docker environment.
#   Option B: cp .env.example .env, then fill in the required Palworld values.
#   docker compose up -d
#   open http://localhost:3000
#
# Shell variables take precedence over the optional local .env file. PalSentry connects *out* to
# your existing Palworld server; it does not run the game server.

services:
  palsentry:
    image: '${PALSENTRY_IMAGE:-ghcr.io/wisdomsky/palsentry:latest}'
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777

    ports:
      - '3000:3000'

    environment:
      # Container invariants: the port and data mount below depend on these values.
      PALSENTRY_PORT: '3000'
      PALSENTRY_HOST: '0.0.0.0'
      PALSENTRY_DATA_DIR: '/data'

      # Required Palworld connection settings. Compose stops with a clear error when either value
      # is missing. Export them from the shell/container manager or place them in an optional .env.
      PALWORLD_REST_URL: '${PALWORLD_REST_URL:?PALWORLD_REST_URL is required}'
      PALWORLD_ADMIN_PASSWORD: '${PALWORLD_ADMIN_PASSWORD:?PALWORLD_ADMIN_PASSWORD is required}'

      # PalSentry defaults. Override these before exposing the dashboard beyond a trusted network.
      PALSENTRY_LOGIN_USERNAME: '${PALSENTRY_LOGIN_USERNAME:-admin}'
      PALSENTRY_LOGIN_PASSWORD: '${PALSENTRY_LOGIN_PASSWORD:-admin}'
      PALSENTRY_LOGIN_PASSWORD_HASH: '${PALSENTRY_LOGIN_PASSWORD_HASH:-}'
      PALSENTRY_SESSION_SECRET: '${PALSENTRY_SESSION_SECRET:-bb5930c05402c03f897c0cdd0e98bb8420a8359f7dbab25fe53df1a5c060d5ea}'
      PALSENTRY_ALLOW_DESTRUCTIVE: '${PALSENTRY_ALLOW_DESTRUCTIVE:-true}'

      # Optional settings are passed through as empty when unset. The application remains the
      # source of truth for their defaults and validation.
      PALSERVER_REST_USERNAME: '${PALSERVER_REST_USERNAME:-}'
      PALSERVER_TIMEOUT_MS: '${PALSERVER_TIMEOUT_MS:-}'
      PALSENTRY_SESSION_TTL_HOURS: '${PALSENTRY_SESSION_TTL_HOURS:-}'
      PALSENTRY_TRUST_PROXY: '${PALSENTRY_TRUST_PROXY:-}'
      PALSENTRY_SAMPLE_INTERVAL_SECONDS: '${PALSENTRY_SAMPLE_INTERVAL_SECONDS:-}'
      PALSENTRY_HISTORY_RETENTION_DAYS: '${PALSENTRY_HISTORY_RETENTION_DAYS:-}'
      PALSENTRY_RESTART_WAIT_SECONDS: '${PALSENTRY_RESTART_WAIT_SECONDS:-}'
      PALSENTRY_RESTART_HEALTH_TIMEOUT_SECONDS: '${PALSENTRY_RESTART_HEALTH_TIMEOUT_SECONDS:-}'
      PALSENTRY_RESTART_POLL_INTERVAL_MS: '${PALSENTRY_RESTART_POLL_INTERVAL_MS:-}'
      PALSENTRY_MAP_TEXTURE_URL: '${PALSENTRY_MAP_TEXTURE_URL:-}'
      PALSENTRY_WORLD_TREE_TEXTURE_URL: '${PALSENTRY_WORLD_TREE_TEXTURE_URL:-}'
      PALSENTRY_MAP_PROJECTION: '${PALSENTRY_MAP_PROJECTION:-}'
      LOG_LEVEL: '${LOG_LEVEL:-}'

    volumes:
      # Persists the ban registry, the audit trail, and metrics history across restarts.
      - ./data:/data

      # Optional: mount your own legally obtained map textures over the bundled artwork, then set
      # PALSENTRY_MAP_TEXTURE_URL and/or PALSENTRY_WORLD_TREE_TEXTURE_URL to paths under /map.
      # - ./map:/app/packages/server/dist/public/map:ro

    # The healthcheck is defined in the Dockerfile. It only checks PalSentry itself, so an
    # offline Palworld server will not mark the dashboard unhealthy.

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
